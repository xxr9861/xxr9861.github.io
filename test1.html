
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Efficient YouTube Embeds</title>
    <style>
        /* Reserve layout space so the page scrollbar doesn't glitch during unloads */
        .video-container {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            margin-bottom: 20px;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>My Embedded YouTube Videos</h1>
        <div class="video-container">

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/yWrPyGJ27Vk" allowfullscreen></iframe>
        </div>
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const iframe = entry.target;
      
      if (entry.isIntersecting) {
        // Only update if src isn't set yet to avoid redundant reloads
        if (iframe.src !== iframe.dataset.src) {
          iframe.src = iframe.dataset.src;
        }
      } else {
        // Completely destroy the active iframe connection and free up memory
        if (iframe.hasAttribute("src")) {
          iframe.removeAttribute("src");
        }
      }
    });
  }, { 
    // Load 400px before coming into view, unload 400px after leaving view
    rootMargin: "400px 0px 400px 0px" 
  });

  // Target iframe tags directly
  document.querySelectorAll("iframe").forEach(iframe => observer.observe(iframe));
</script>
